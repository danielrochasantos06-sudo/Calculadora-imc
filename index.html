<!DOCTYPE html>
<head>
	<title>Calculadora IMC</title>
	<style>
		body { 
			display: flex;
			align-items: center;
			justify-content: center;
			height:100vh;
			font-family: Arial;
			background:#ccc
		}
		
		div {
			display: flex;
			flex-direction: column;
			width: 400px;
			border: 1px solid #fafafa;
			padding: 20px 35px;
			border-redius:15px;
			background: #faa115
		}

		h1 {
			text-align: center;
		}
			
		input {  
			height:30px;
			margin-botton:15px;
			padding: 0 5px;
		}

		button { 
			height: 60px;
			font-size:25px;
			text-transform: uppercase;
			font-weight: 800;
			margin: 25px 0;
			border: 0;
			border-radius: 15px;
			background: #020c81;
			color:#fff;
			cursor: pointer
		}
	</style>

</head>
<body>
	<div>
		<h1>Calculadora de IMC </h1>
		
		<label for="altura">Digite sua altura:</label>
		<input type="number" id="altura">
		
		<label for="peso">Digite seu peso:</label>
		<input  type="number" id="peso">

		<button id="calcular">Calcular</button>
	</div>

	
	<script>
		var calcular = document.getElementById("calcular");

		calcular.addEventListener("click", () => {
		

			//obter altura
			var altura  = +document.getElementById("altura").value;

			// obter peso

			var peso = +document.getElementById("peso").value;
			
			//calcular IMC utilizando altura

			var imc = peso /(altura*altura)

			//calcular imc

			var situacao ="";
			if (imc < 17)
				situacao = "Muito abaixo do peso, Raquitico";
			else if (imc >= 17 && imc <= 18.49)
				situacao = "Abaixo do peso, Frangolino";
			else if (imc >= 18.5 && imc <= 24.99)
				situacao = "Peso normal, Frango";
			else if (imc >= 25 && imc <= 29.99)
				situacao = "Acima do peso, se for massa muscular, esta otimo."
			else if (imc >= 30 && imc <= 34.99)
				situacao = "Obesidade 1, Praticar Corrida.";
			else if (imc >= 35 && imc <= 39.99)
				situacao = "Obesidade 2, Procurar um Nutricionista.";
			else if (imc >= 40 )
				situacao = "Obesidade 3, A PORTA DO CAIXAO ESTA SE FECHANDO.";

			alert(situacao);
		});

	</script>

</body>
